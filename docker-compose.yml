version: "3.9"

# ============================================================================
# Automotive Knowledge RAG System - Docker Compose Deployment
# ============================================================================

services:

  # ── Main Application ──────────────────────────────────────────────────────
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:-dev-service-token-2026}
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - rag-network

  # ── Infrastructure: Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    expose:
      - "6379"  # 仅 Docker 网络内部访问，不映射到宿主机
    volumes:
      - redis-data:/data
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD:-changeme-in-production}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme-in-production}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme-in-production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  # ── Infrastructure: Milvus ──────────────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.3.3
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  # ── Infrastructure: etcd ────────────────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  # ── Infrastructure: MinIO ───────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-changeme-in-production}
    volumes:
      - minio-data:/minio_data
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  # ── Infrastructure: Elasticsearch ───────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.12.0
    expose:
      - "9200"  # 仅 Docker 网络内部访问
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false  # 内网部署，禁用安全简化配置
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  # ── vLLM: Generation 14B ───────────────────────────────────────────────
  vllm-gen-14b:
    image: vllm/vllm-openai:latest
    ports:
      - "8100:8000"
    volumes:
      - ./models:/models
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: >
      --model /models/Qwen3-14B-Instruct
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.85
      --max-model-len 8192
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - rag-network

  # ── vLLM: Rewrite ──────────────────────────────────────────────────────
  vllm-rewrite:
    image: vllm/vllm-openai:latest
    ports:
      - "8101:8000"
    volumes:
      - ./models:/models
    environment:
      - CUDA_VISIBLE_DEVICES=1
    command: >
      --model /models/Qwen3-4B-Instruct
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.5
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - rag-network

  # ── vLLM: Generation 4B ───────────────────────────────────────────────
  vllm-gen-4b:
    image: vllm/vllm-openai:latest
    ports:
      - "8102:8000"
    volumes:
      - ./models:/models
    environment:
      - CUDA_VISIBLE_DEVICES=1
    command: >
      --model /models/Qwen3-4B-Instruct
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - rag-network

# ── Volumes ──────────────────────────────────────────────────────────────
volumes:
  redis-data:
  milvus-data:
  etcd-data:
  minio-data:
  es-data:

# ── Network ─────────────────────────────────────────────────────────────
networks:
  rag-network:
    driver: bridge
