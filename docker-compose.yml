# ============================================================================
# Beauty Industry RAG QA System - Docker Compose Deployment
# ============================================================================

services:

  # ── Main Application ──────────────────────────────────────────────────────
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:?SERVICE_AUTH_TOKEN must be set}
      - QDRANT_HOST=qdrant
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD must be set}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

  # ── Infrastructure: Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  # ── Infrastructure: Qdrant ──────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  # ── Infrastructure: MinIO ───────────────────────────────────────────────
  # MinIO Community Edition is a source-only distribution and the official
  # minio/minio Docker Hub repository has been deleted, so no public
  # minio/minio:<tag> reference can be resolved any more. This service builds
  # MinIO from the official upstream source at an immutable commit instead;
  # see deploy/minio/Dockerfile for the provenance and license boundary.
  # MINIO_COMMIT is the final commit on master of the archived upstream
  # repository (7aac2a2c5b7c882e68c1ce017d8256be2feea27f, 2026-02-12) and is
  # verified by tests/test_container_image_pins.py.
  #
  # `pull_policy: build` is load-bearing. The image tag encodes only the
  # upstream MinIO commit, so it does not change when this Dockerfile changes;
  # without an explicit build policy a host that already has the tag would
  # silently reuse the cached image and skip digest pins, the non-root
  # runtime, or any later deliberate base-image refresh.
  minio:
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
      args:
        MINIO_COMMIT: 7aac2a2c5b7c882e68c1ce017d8256be2feea27f
    image: beauty-rag-minio:7aac2a2c
    pull_policy: build
    expose:
      - "9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - minio-data:/minio_data
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  # ── Infrastructure: Elasticsearch ───────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.12.0
    expose:
      - "9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD must be set}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

# ── Volumes ──────────────────────────────────────────────────────────────
volumes:
  redis-data:
  qdrant-data:
  minio-data:
  es-data:

# ── Network ─────────────────────────────────────────────────────────────
networks:
  rag-network:
    driver: bridge
