# Non-secret runtime configuration for the API gateway.
#
# Only variables that the application actually reads are set here. The list was
# verified against `os.environ.get(...)` call sites in api/, core/, common/,
# retrieval/ and router/; nothing is listed speculatively.
#
# Secrets are never placed in this file. See secret.example.yaml.
#
# Evidence level: REPO_VERIFIED (static manifest validation only).
# Applying this to a real cluster is PENDING.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-api-config
  namespace: beauty-rag
  labels:
    app.kubernetes.io/name: beauty-industry-rag-qa
    app.kubernetes.io/component: api
data:
  # ── Inference service routing ────────────────────────────────────────────
  # Without these the routers fall back to http://localhost:8101 / :8100, so
  # generation and query rewriting would call back into the API pod itself and
  # degrade every query. These are the same variables docker-compose sets for
  # the microservices topology; adjust the host names to match the Services you
  # actually create.
  REWRITE_SERVICE_URL: "http://rewrite-service:8101"
  GENERATION_SERVICE_URL: "http://generation-service:8100"

  # ── Datastores ───────────────────────────────────────────────────────────
  # Dependency addresses, mirroring the docker-compose service names.
  QDRANT_HOST: "qdrant"
  REDIS_CACHE_HOST: "redis"
  REDIS_CACHE_PORT: "6379"
  REDIS_CACHE_DB: "0"

  # Elasticsearch username. NOT optional: BM25Retriever only enables basic_auth
  # when username AND password are both non-empty, so omitting this makes the
  # anonymous `info()` call fail with 401 and permanently disables BM25 for the
  # process. The password lives in the Secret.
  ELASTICSEARCH_USERNAME: "elastic"

  # ── Auth ─────────────────────────────────────────────────────────────────
  # config.json ships auth.dev_mode=false, so the RS256 path is the only one
  # that enables /api/auth/login: auth/jwt_auth.get_jwt_config() gates on
  # JWT_ALGORITHM being set and then requires both key paths to exist.
  # The key files themselves are operator-provided and are NOT shipped here -
  # see the authentication section of the deployment guide. Until they are
  # mounted, protected endpoints correctly return 401 rather than falling open.
  JWT_ALGORITHM: "RS256"
  JWT_PRIVATE_KEY_PATH: "/etc/rag-auth/jwt-private.pem"
  JWT_PUBLIC_KEY_PATH: "/etc/rag-auth/jwt-public.pem"

  # Same value as docker-compose.cpu.yml; production overrides this explicitly.
  DEPLOYMENT_MODE: "development"

  # Not set here on purpose:
  #   CONFIG_PATH      - the image already ships the canonical config.json
  #   CORS_ORIGINS     - a wildcard default is a development-only posture and
  #                      must be set explicitly per environment
  #   TRUSTED_PROXIES  - only meaningful behind a load balancer that sets
  #                      X-Forwarded-For; empty means do not trust it
  #   DATABASE_URL     - see api-deployment.yaml; the user store is not yet
  #                      shareable across replicas