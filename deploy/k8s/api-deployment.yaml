# Minimal Kubernetes deployment contract for the RAG QA API.
#
# Scope: exactly one workload (the FastAPI monolith, `app.py`) plus its Service,
# ConfigMap and Secret reference. This is NOT the retained `api-gateway/`
# microservice component - the image is the repository root Dockerfile, whose
# entrypoint is `python app.py`. vLLM inference, Qdrant, Elasticsearch, Redis and
# MinIO are deliberately NOT included - the app expects them to exist as
# in-cluster services, matching the docker-compose topology.
#
# Probe design note (verified against the running application):
#   Two endpoints, two different questions. They are not interchangeable.
#
#   GET /api/health - DIAGNOSTIC. Returns HTTP 200 even when Redis, Qdrant and
#     Elasticsearch are ALL unreachable, with body
#     {"status": "degraded", ...}. It reports what it observed; it does not
#     decide whether this Pod can take traffic.
#
#   GET /api/ready - TRAFFIC ADMISSION. Fails closed with HTTP 503 when the
#     minimum serving contract is unmet, so Kubernetes removes the Pod from
#     Endpoints. Ready requires:
#       (a) at least one retrieval path: Qdrant OR Elasticsearch (either alone
#           still returns candidates);
#       (b) every generation endpoint this deployment's routing selects
#           reachable - gen_4b always, plus gen_14b in production, where the
#           complex tier routes to it and there is no runtime fallback to 4B.
#     Redis and MinIO failures are reported as degraded and do NOT fail
#     readiness: RedisCache keeps an L1 process-local cache and login rate
#     limiting falls back in-memory; MinIO only serves /api/media/{doc_id}.
#
#   Consequence for the probes:
#     - livenessProbe uses tcpSocket so a dependency outage can never trigger a
#       restart loop of the gateway itself;
#     - readinessProbe targets /api/ready and is therefore dependency-aware;
#     - startupProbe stays on /api/health (process-started question), so a
#       dependency outage during a rollout cannot delay startup into a restart.
#
#   /api/ready requires no user JWT (a probe cannot carry credentials) and its
#   payload contains only dependency names and booleans - no hosts, URLs, DSNs
#   or secrets.
#
#   GET /api/metrics requires authentication (401 without a token), so it is
#   NOT used as a probe endpoint.
#
# Evidence level: REPO_VERIFIED - meaning only that these manifests pass the
# deterministic static checks in tests/deploy/test_k8s_manifests.py.
# No Kubernetes cluster has applied, admitted, rolled out or served this
# manifest. Real cluster deployment is PENDING.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: beauty-rag
  labels:
    app.kubernetes.io/name: beauty-industry-rag-qa
    app.kubernetes.io/component: api
spec:
  # replicas: 1 is deliberate, not an oversight.
  #
  # The user store is SQLite at ./data/users.db (auth/user_store.py, overridable
  # only by DATABASE_URL) and this contract declares no shared storage and no
  # external database backend. With replicas > 1 the replicas hold divergent
  # user rows: a user created through one pod can fail to log in through the
  # other, stale role masks persist, and every user on a replaced pod
  # disappears.
  #
  # Raising this count requires a shared user store first. That is real work
  # this minimal contract does not do, and it is NOT a production-readiness
  # claim. maxUnavailable: 0 below also keeps the rollout from dropping the
  # single replica's traffic.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: beauty-industry-rag-qa
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beauty-industry-rag-qa
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # The image's only user is `appuser`; name that group so mounted Secret
        # volumes are group-owned and readable. See the jwt-keys volume below.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          # Image tag policy: pin an explicit version. Do not use a floating tag.
          # This repository builds the image locally from the Dockerfile at the
          # repository root; no published image exists, so the operator must
          # build and push to their own registry and substitute the reference.
          image: ghcr.io/example/beauty-industry-rag-qa:2.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rag-api-config
            # Secret values are referenced, never inlined.
            - secretRef:
                name: rag-api-secrets
          # startupProbe stays on /api/health deliberately. It answers a
          # different question from readiness: "has the process finished
          # starting", which /api/health answers as soon as the app serves HTTP.
          # Switching it to /api/ready would couple startup to dependency
          # availability, so a dependency outage during a rollout could delay
          # startup past failureThreshold and trigger a restart loop - exactly
          # the failure mode liveness is designed to avoid.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # livenessProbe remains tcpSocket and dependency-independent. GET
          # /api/health returns 200 even when every dependency is unreachable,
          # so an httpGet liveness probe here could never fail and would be
          # actively misleading about whether this process is alive.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # readinessProbe is the only dependency-aware probe. /api/ready fails
          # closed (HTTP 503) when the minimum serving contract fails:
          # no retrieval path (Qdrant AND Elasticsearch both unavailable) or a
          # generation endpoint this deployment routes to being unreachable.
          # Redis and MinIO outages do NOT fail readiness - their code paths
          # degrade, so removing a serving Pod would be wrong.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # RS256 key material for the primary auth path (see configmap.yaml).
            # Create it out of band:
            #   kubectl -n beauty-rag create secret generic rag-jwt-keys \
            #     --from-file=jwt-private.pem --from-file=jwt-public.pem
            # File names must match JWT_PRIVATE_KEY_PATH / JWT_PUBLIC_KEY_PATH.
            # Absent this mount, /api/auth/login reports the RS256 path as
            # unconfigured and protected endpoints return 401; it never falls
            # open to an unauthenticated mode.
            #
            # fsGroup is required, not cosmetic. Secret volumes are mounted
            # root-owned; the image runs as appuser under runAsNonRoot, so
            # defaultMode 0400 alone would make both keys unreadable and login
            # would still fail. 0440 plus fsGroup gives the app group read
            # access while keeping the private key unreadable by others.
            - name: jwt-keys
              mountPath: /etc/rag-auth
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: rag-jwt-keys
            defaultMode: 0440

      # No models volume is declared on purpose. docker-compose.yml bind-mounts
      # ./models into the container, but this repository ships no model weights:
      # every real weight is PENDING (see issues #8 and #12). Declaring a
      # PersistentVolumeClaim here would reference storage that this contract
      # does not define, and a Pod whose PVC is missing never schedules.
      # When real weights are provisioned, add the mount together with the
      # storage that backs it.
      #
      # For the same reason there is no data volume for ./data/users.db: with
      # replicas: 1 the store lives and dies with the pod. That is a real
      # limitation, stated rather than hidden, and it is why this contract does
      # not claim production readiness.
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: beauty-rag
  labels:
    app.kubernetes.io/name: beauty-industry-rag-qa
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  # Must stay a subset of the Deployment pod template labels.
  selector:
    app.kubernetes.io/name: beauty-industry-rag-qa
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP