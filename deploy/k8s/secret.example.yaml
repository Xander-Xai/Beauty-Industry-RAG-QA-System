# Secret TEMPLATE for the API gateway.
#
# This file intentionally contains NO secret values. It declares the key names
# only, so that `kubectl apply` produces a valid Secret object whose payload an
# operator must fill in out of band.
#
# Do NOT commit a filled-in copy of this file. Create the real Secret with, for
# example:
#
#   kubectl -n beauty-rag create secret generic rag-api-secrets \
#     --from-literal=SERVICE_AUTH_TOKEN="$SERVICE_AUTH_TOKEN" \
#     --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
#     --from-literal=REDIS_CACHE_PASSWORD="$REDIS_CACHE_PASSWORD" \
#     --from-literal=JWT_SECRET="$JWT_SECRET" \
#     --from-literal=ELASTICSEARCH_PASSWORD="$ELASTICSEARCH_PASSWORD"
#
# These five keys are the same ones docker-compose.yml enforces with ${VAR:?},
# except REDIS_CACHE_PASSWORD / JWT_SECRET, which the application reads
# directly. Every key below was verified against an os.environ.get call site.
#
# Evidence level: REPO_VERIFIED (static manifest validation only).
# No Secret has been created in any cluster.
apiVersion: v1
kind: Secret
metadata:
  name: rag-api-secrets
  namespace: beauty-rag
  labels:
    app.kubernetes.io/name: beauty-industry-rag-qa
    app.kubernetes.io/component: api
type: Opaque
# Placeholder payload. Replace before applying; never commit real values.
stringData:
  SERVICE_AUTH_TOKEN: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  REDIS_CACHE_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  ELASTICSEARCH_PASSWORD: "REPLACE_ME"