# Prometheus 配置 — 化妆品行业 RAG 问答系统
#
# 抓取目标（按顺序）：
#   1. `rag-api`             -> canonical FastAPI 单体的 /api/metrics（需 Bearer token）
#                              这是 6 条告警规则唯一依赖的 series 来源。
#   2. `rag-monitoring-service` -> 可选的遗留微服务组件，不在 canonical 部署中，
#                              不 emit 任何告警规则引用的 series。
#
# `job` 标签由本文件的 scrape 配置添加，不是应用 emit 的。注意 job 2 的
# `rag_redis_degraded_mode` 与 job 1 同名（详见 monitoring/prometheus/alerts.yml
# 顶部说明），所以引用该 series 的告警规则用 `job="rag-api"` 限定，避免遗留组件
# 的值误触发 canonical 告警。启用 job 2 前请先确认这一点。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules for the canonical monolith. Load them with:
#     rule_files:
#       - /etc/prometheus/monitoring/prometheus/alerts.yml
# Every threshold in that file is a DESIGN_TARGET.
rule_files:
  - /etc/prometheus/monitoring/prometheus/alerts.yml

scrape_configs:
  # Canonical monolith (app.py). This is the job the alerts in
  # monitoring/prometheus/alerts.yml are written against: rag_http_* and
  # rag_redis_degraded_mode are emitted by /api/metrics on this path.
  #
  # /api/metrics requires authentication, so the token must be provided as a
  # file rather than inline. Prometheus does NOT expand environment variables in
  # its config, so a token cannot be injected without writing it to disk:
  #
  #   1. mint a short-lived token:  see docs/slo-runbook.md#auditlookup
  #   2. printf '%s' "$TOKEN" > deploy/prometheus-token && chmod 600 ...
  #   3. keep deploy/prometheus-token OUT of version control
  #
  # Without the token file this job returns 401 and `up` is 0, which is
  # indistinguishable from the API being down — RagAppDown's description says so.
  - job_name: 'rag-api'
    scheme: http
    metrics_path: '/api/metrics'
    bearer_token_file: '/etc/prometheus/rag_metrics_token'
    static_configs:
      - targets: ['app:8000']
        labels:
          service: 'rag-api'
    scrape_interval: 15s

  # PRD §12: 监控微服务指标
  - job_name: 'rag-monitoring-service'
    static_configs:
      - targets: ['monitoring-service:8400']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
