# Candidate single-host release. Requires independently provisioned external services.
services:
  app:
    build: .
    env_file:
      - ${RAG_RUNTIME_ENV_FILE:?Set private runtime env file}
    environment:
      RAG_RELEASE_PROFILE: industrial
      DEPLOYMENT_MODE: production
      AUTH_DEV_MODE: "false"
      JWT_ALGORITHM: RS256
      CONFIG_PATH: /release/config.json
      RAG_RELEASE_MANIFEST: /release/manifest.json
      RAG_RELEASE_MANIFEST_SHA256: ${RAG_RELEASE_MANIFEST_SHA256:?Set reviewed release digest}
      JWT_PRIVATE_KEY_PATH: /release/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /release/keys/public.pem
      DATABASE_URL: sqlite:////app/data/users.db
      MODEL_ASSET_ROOT: /assets/models
    volumes:
      - ${RAG_CONFIG_FILE:?Set config path}:/release/config.json:ro
      - ${RAG_MANIFEST_FILE:?Set reviewed manifest path}:/release/manifest.json:ro
      - ${RAG_KEY_DIR:?Set protected key directory}:/release/keys:ro
      - ${RAG_ASSET_DIR:?Set model asset directory}:/assets/models:ro
      - ${RAG_IDENTITY_DATA_DIR:?Set persistent identity directory}:/app/data
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
  web:
    build: ./frontend
    volumes:
      - ./deploy/industrial-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${RAG_WEB_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
