name: CI — 测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-sanity:
    name: Dockerfile 构建校验
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Build *validity* only. Nothing is built, pushed or deployed.
    #
    # A full `docker build` is deliberately NOT a merge gate: requirements.txt
    # pulls torch / CUDA wheels, so a real build is a multi-GB network download
    # that is slow and flaky. It would trade a cheap signal for an unreliable
    # one.
    steps:
      - uses: actions/checkout@v4

      # `COPY . .` with no .dockerignore sends the whole working tree. On a
      # machine with models and node_modules downloaded that reached ~1.9 GB,
      # with ~1.8 GB of it an untracked model cache, and it would include .env
      # if one existed. These asserts keep the ignore rules from silently
      # regressing to a no-op.
      - name: Verify the build context excludes local state
        run: |
          set -euo pipefail
          test -f .dockerignore
          for pattern in .git .env models blip-image-captioning-large frontend/node_modules logs data; do
            grep -qxF "$pattern" .dockerignore || grep -qxF "$pattern/**" .dockerignore || {
              echo "::error file=.dockerignore::missing required exclude: $pattern"
              exit 1
            }
          done
          # A negation that re-admits secrets or model weights would defeat the
          # whole file. `!.env.example` is safe (template only) and must not
          # match, hence the explicit terminator.
          if grep -nE '^!\s*(\.env|keys|models|blip-image-captioning-large)(/|/[^.]|\s|$)' .dockerignore; then
            echo "::error file=.dockerignore::secrets/model directories must not be re-admitted"
            exit 1
          fi

      - name: Dockerfile build check
        run: |
          set -euo pipefail
          if docker build --help 2>&1 | grep -q -- '--check'; then
            # Parses the Dockerfile and reports build-time problems. No RUN step
            # executes, so no dependency is downloaded.
            docker build --check .
          else
            echo "::notice::runner Docker build does not support --check; Dockerfile parse check skipped"
          fi

  frontend-build:
    name: 前端构建校验
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # README documents `npm ci && npm run build` as the way to produce
    # frontend/dist, and the pre-launch checklist requires a built frontend, yet
    # nothing in CI verified the build could still succeed. package-lock.json is
    # complete (lockfileVersion 3) and the build is fast, so this is a cheap
    # merge gate. `npm ci` installs from the lockfile only; it never resolves
    # floating ranges.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies from the lockfile
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Known, disclosed, not gating: `npm ci` currently reports 4 advisories
      # (1 moderate, 3 high) in browserslist, nanoid, postcss and
      # baseline-browser-mapping. All four are transitive build-toolchain
      # dependencies reached through Vite, not code the browser executes as
      # application logic. `npm audit` is NOT a merge gate here because the
      # registry's quick-audit endpoint is deprecated and returns 400, which
      # would make the gate flaky rather than meaningful. See
      # docs/repository-truth-audit.md for the recorded state.
      - name: Report (do not gate) frontend dependency advisories
        working-directory: frontend
        continue-on-error: true
        run: npm audit || true

  test:
    name: 测试套件
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Repository consistency
        run: python scripts/check_repo_consistency.py

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run tests
        env:
          JWT_SECRET: ci-test-secret-key-for-github-actions-only
          DEPLOYMENT_MODE: testing
          DATABASE_URL: sqlite:///./data/test_users.db
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --timeout=60 \
            -x

  evaluation-guard:
    name: 评估确定性守卫
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      # Deterministic only: schema/count/classification checks and harness
      # unit tests. RAGAS itself is intentionally NOT installed, so this job
      # proves the missing-dependency path stays non-misleading.
      - name: Validate golden set schema and size
        run: |
          python -m tests.evaluation.validate_golden_set \
            --dataset tests/evaluation/golden_set.jsonl

      - name: RAGAS harness + reporter unit tests (no real ragas)
        env:
          DEPLOYMENT_MODE: testing
        run: python -m pytest tests/evaluation/ -q

  ragas-evaluator-smoke:
    name: RAGAS evaluator smoke（需显式启用）
    # Opt-in only. This is an evaluator smoke (reference answers), not a
    # project-pipeline quality run: CI has no vLLM/Qdrant/ES. The RAGAS deps are
    # known-unfixed and live only in requirements-ragas.txt, never in the
    # default production requirements. --require-ragas fails fast instead of
    # emitting an all-zero fallback report.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.RAGAS_EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Isolated, pinned evaluator deps (vet the security note in the file
          # before enabling the RAGAS_EVAL_ENABLED repository variable).
          pip install -r requirements-ragas.txt

      - name: Require API key
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "OPENAI_API_KEY is not configured; refusing to run the real RAGAS evaluator." >&2
            exit 1
          fi

      - name: Run RAGAS evaluator smoke (fails if ragas is unavailable)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEPLOYMENT_MODE: testing
        run: |
          python -m tests.evaluation.ragas_eval \
            --dataset tests/evaluation/golden_set.jsonl \
            --tag ci-${{ github.sha }} \
            --report-dir data/eval/reports \
            --limit 15 \
            --require-ragas

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: ragas-evaluator-smoke-report
          path: data/eval/reports/
