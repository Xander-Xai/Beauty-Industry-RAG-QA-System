name: CI — 测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sanity:
    name: Dockerfile 构建校验
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Build *validity* only. Nothing is built, pushed or deployed.
    #
    # A full `docker build` is deliberately NOT a merge gate: requirements.txt
    # pulls torch / CUDA wheels, so a real build is a multi-GB network download
    # that is slow and flaky. It would trade a cheap signal for an unreliable
    # one.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `COPY . .` with no .dockerignore sends the whole working tree. On a
      # machine with models and node_modules downloaded that reached ~1.9 GB,
      # with ~1.8 GB of it an untracked model cache, and it would include .env
      # if one existed. These asserts keep the ignore rules from silently
      # regressing to a no-op.
      - name: Verify the build context excludes local state
        run: |
          set -euo pipefail
          test -f .dockerignore
          for pattern in .git .env models blip-image-captioning-large frontend/node_modules logs data deploy/prometheus-token; do
            grep -qxF "$pattern" .dockerignore || grep -qxF "$pattern/**" .dockerignore || {
              echo "::error file=.dockerignore::missing required exclude: $pattern"
              exit 1
            }
          done
          # A negation that re-admits secrets or model weights would defeat the
          # whole file. `!.env.example` is safe (template only) and must not
          # match, hence the explicit terminator.
          # Permit only explicit tracked model source files, never globs or
          # whole model directories. Keep the secret/weight exclusion.
          while IFS= read -r rule; do
            case "$rule" in
              '!models/__init__.py') git ls-files --error-unmatch "models/__init__.py" >/dev/null ;;
              '!models/adapter_manager.py') git ls-files --error-unmatch "models/adapter_manager.py" >/dev/null ;;
              '!models/blip_service.py') git ls-files --error-unmatch "models/blip_service.py" >/dev/null ;;
              '!models/complexity_evaluator.py') git ls-files --error-unmatch "models/complexity_evaluator.py" >/dev/null ;;
              '!models/embedding_service.py') git ls-files --error-unmatch "models/embedding_service.py" >/dev/null ;;
              '!models/llm_client.py') git ls-files --error-unmatch "models/llm_client.py" >/dev/null ;;
              *) echo "::error file=.dockerignore::unsafe secret/model exemption"; exit 1 ;;
            esac
          done < <(grep -E '^!\s*(\.env|keys|models|blip-image-captioning-large)(/|/[^.]|\s|$)' .dockerignore || true)

      - name: Dockerfile build check
        run: |
          set -euo pipefail
          if docker build --help 2>&1 | grep -q -- '--check'; then
            # Parses the Dockerfile and reports build-time problems. No RUN step
            # executes, so no dependency is downloaded.
            docker build --check .
          else
            echo "::notice::runner Docker build does not support --check; Dockerfile parse check skipped"
          fi

  frontend-build:
    name: 前端构建校验
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # README documents `npm ci && npm run build` as the way to produce
    # frontend/dist, and the pre-launch checklist requires a built frontend, yet
    # nothing in CI verified the build could still succeed. package-lock.json is
    # complete (lockfileVersion 3) and the build is fast, so this is a cheap
    # merge gate. `npm ci` installs from the lockfile only; it never resolves
    # floating ranges.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies from the lockfile
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # The lockfile was refreshed in PRs #164, #166 and #167. The exact-main
      # npm ci and npm audit runs report zero vulnerabilities after that update.
      # Keep npm audit non-gating because the registry's quick-audit endpoint is
      # deprecated and can return HTTP 400. See the dated record in
      # docs/repository-truth-audit.md.
      - name: Report (do not gate) frontend dependency advisories
        working-directory: frontend
        continue-on-error: true
        run: npm audit || true

  enterprise-readiness:
    name: 企业就绪配置校验
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Deterministic configuration checks for the enterprise-readiness artifacts:
    # alert rules, the OTLP exporter contract, the performance artifact contract
    # and the optional observability overlay. No real backend, no real collector,
    # no real model and no real RAGAS here — those stay optional and manual.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Alert rules reference only emitted metrics
        run: python -m pytest tests/monitoring/ -q

      - name: Performance artifact contract
        run: python -m pytest tests/performance/ tests/test_audit_log.py -q

      - name: Validate the optional observability overlay is additive
        env:
          REDIS_PASSWORD: ci-only-not-a-secret
          ELASTICSEARCH_PASSWORD: ci-only-not-a-secret
          MINIO_ACCESS_KEY: ci-only
          MINIO_SECRET_KEY: ci-only-not-a-secret
          SERVICE_AUTH_TOKEN: ci-only-not-a-secret
          GF_SECURITY_ADMIN_PASSWORD: ci-only-not-a-secret
        run: |
          set -euo pipefail
          # The overlay must be purely additive: plain `docker compose up` may not
          # start Prometheus, Jaeger or Grafana, and layering it on must not remove
          # or redefine a canonical service.
          base=$(mktemp); layered=$(mktemp)
          docker compose -f docker-compose.yml config --services | sort > "$base"
          docker compose -f docker-compose.yml -f docker-compose.observability.yml \
            config --services | sort > "$layered"

          added=$(comm -13 "$base" "$layered" | tr '\n' ' ')
          removed=$(comm -23 "$base" "$layered" | tr -d '\n')
          echo "added: $added"
          echo "removed: '${removed:-none}'"
          test -z "$removed" || {
            echo "::error::the overlay removes canonical services: $removed"; exit 1; }
          for svc in prometheus jaeger grafana; do
            echo "$added" | grep -q "$svc" || {
              echo "::error::$svc missing from the observability overlay"; exit 1; }
          done

      - name: Documented alert inventory matches the rule file
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import re
          import sys
          from pathlib import Path

          alerts = Path("monitoring/prometheus/alerts.yml").read_text(encoding="utf-8")
          runbook = Path("docs/slo-runbook.md").read_text(encoding="utf-8")
          names = set(re.findall(r"^\s*- alert:\s*(\w+)", alerts, re.MULTILINE))
          missing = sorted(n for n in names if n not in runbook)
          if missing:
              print(f"::error::alerts missing from the runbook: {missing}")
              sys.exit(1)
          print(f"{len(names)} alerts, all covered by the runbook")
          PYCODE

  test:
    name: 测试套件
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        # Python 3.11 is the supported runtime floor: Pillow >= 13.0.0 (the
        # release that fixed CVE-2026-112395/-112397/-112400/-112404/-112895/
        # -112896/-112897/-112899) requires Python >= 3.11, and 12.3.0 — the
        # newest 3.10-compatible release — carries all eight. A 3.10 lane
        # could only install a Pillow with open advisories, so the matrix
        # covers the runtime the image actually ships.
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Repository consistency
        run: python scripts/check_repo_consistency.py

      - name: Public repository boundary
        run: python scripts/check_public_repository_boundary.py

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run tests
        env:
          JWT_SECRET: ci-test-secret-key-for-github-actions-only
          DEPLOYMENT_MODE: testing
          DATABASE_URL: sqlite:///./data/test_users.db
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --timeout=60 \
            -x

  evaluation-guard:
    name: 评估确定性守卫
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Deterministic only: schema/count/classification checks and harness
      # unit tests. RAGAS itself is intentionally NOT installed, so this job
      # proves the missing-dependency path stays non-misleading.
      - name: Validate golden set schema and size
        run: |
          python -m tests.evaluation.validate_golden_set \
            --dataset tests/evaluation/golden_set.jsonl

      - name: RAGAS harness + reporter unit tests (no real ragas)
        env:
          DEPLOYMENT_MODE: testing
        run: python -m pytest tests/evaluation/ -q

      # The v2 annotation dataset is committed empty because the annotation pass
      # is a human task that has not been performed. This step asserts that
      # nothing slipped into it: a synthesized or LLM-generated record must not
      # be able to enter the dataset unremarked. When a human starts annotating,
      # --allow-empty is removed and the step becomes a real audit.
      - name: Golden set v2 annotation dataset must stay unannotated
        run: |
          python scripts/validation/audit_annotations.py \
            --dataset tests/evaluation/golden_set_v2/annotations_v1.jsonl \
            --allow-empty

      # The work order that quotes fixture questions carries its own data
      # provenance, so a forwarded copy cannot read as regulation. Regenerated
      # here rather than trusted: the committed file must be exactly what the
      # tool produces.
      - name: Annotation backlog disclosure boundary
        run: |
          python scripts/validation/audit_annotations.py \
            --dataset tests/evaluation/golden_set_v2/annotations_v1.jsonl \
            --allow-empty \
            --backlog tests/evaluation/golden_set_v2/HUMAN_ANNOTATION_BACKLOG.md
          git diff --exit-code -- tests/evaluation/golden_set_v2/HUMAN_ANNOTATION_BACKLOG.md

      # Schema and transition rules for every regulatory assertion in the
      # fixtures: no entry may claim to be verified against an authoritative
      # source without a named reviewer, a real calendar date, a conclusion, a
      # versioned citation and an established licence, and a synthetic
      # placeholder can never be promoted at all. Coverage — that no claim
      # family has silently lost its row — is pinned separately in
      # tests/validation/test_regulatory_review_checklist.py.
      - name: Regulatory assertion review checklist
        run: python scripts/validation/regulatory_review.py --check

      # Keeps the documented contract field list in sync with the validator.
      - name: Repository consistency guard
        run: python scripts/check_repo_consistency.py

      # Every shipped data asset must be classified in DATA_MANIFEST.json, and
      # synthetic assets must still carry the marker that tells a reader their
      # regulatory content is fabricated. This is the gate that keeps a new
      # dataset from shipping unregistered.
      - name: Public repository boundary guard
        run: python scripts/check_public_repository_boundary.py

  ragas-evaluator-smoke:
    name: RAGAS evaluator smoke（需显式启用）
    # Opt-in only. This is an evaluator smoke (reference answers), not a
    # project-pipeline quality run: CI has no vLLM/Qdrant/ES. Strict pip-audit
    # must pass before credentials are exposed. RAGAS remains isolated from
    # production requirements.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.RAGAS_EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ragas.txt
          pip install pip-audit

      - name: Security admission for isolated evaluator dependencies
        run: pip-audit --strict --desc --requirement requirements-ragas.txt

      - name: Require API key
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "OPENAI_API_KEY is not configured; refusing to run the real RAGAS evaluator." >&2
            exit 1
          fi

      - name: Run RAGAS evaluator smoke (fails if ragas is unavailable)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAGAS_SECURITY_APPROVED: "1"
          DEPLOYMENT_MODE: testing
        run: |
          python -m tests.evaluation.ragas_eval \
            --dataset tests/evaluation/golden_set.jsonl \
            --tag ci-${{ github.sha }} \
            --report-dir data/eval/reports \
            --limit 15 \
            --require-ragas

      - name: Upload evaluation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ragas-evaluator-smoke-report
          path: data/eval/reports/
