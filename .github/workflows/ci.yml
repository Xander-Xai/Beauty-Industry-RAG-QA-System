name: CI — 测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: 测试套件
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Repository consistency
        run: python scripts/check_repo_consistency.py

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run tests
        env:
          JWT_SECRET: ci-test-secret-key-for-github-actions-only
          DEPLOYMENT_MODE: testing
          DATABASE_URL: sqlite:///./data/test_users.db
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --timeout=60 \
            -x
