name: Security — 依赖安全扫描

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 UTC 08:00 自动扫描
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  dependency-scan:
    name: pip-audit 依赖漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt

      # This workflow runs on pull requests and is a merge check. Fail on findings.
      - name: Run pip-audit (merge gate)
        run: pip-audit --strict --desc --requirement requirements.txt

  secret-scan:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pin to a published release tag instead of a floating branch.
      - name: TruffleHog secret scan (merge gate)
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          extra_args: --only-verified

      # TruffleHog's `--only-verified` deliberately ignores credentials it
      # cannot confirm are live, so a revoked or never-issued token still in the
      # tree would pass. Gitleaks covers the other half: pattern and entropy
      # matching over the full history, without requiring verification.
      # Both are pinned to a release tag rather than a floating branch.
      # Gitleaks refuses to scan a `pull_request` event without a token, since
      # the event payload it needs to diff the base is fetched through the API.
      # `GITHUB_TOKEN` is the automatically created per-run token; this job only
      # needs `contents: read`, which the workflow already grants.
      #
      # v3, not v2: v3 moves the runtime from Node 20 to Node 24. GitHub removed
      # Node 20 from hosted runners on 2026-09-16, and v2 then stops loading
      # regardless of `ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION`. v3 keeps the
      # same inputs and behaviour. Both tools are pinned to a release tag.
      #
      # Scope, stated precisely: on a `pull_request` event the action scans the
      # commit range introduced by the PR, not the whole history. A full-history
      # scan was run separately (210 commits, 1583 blobs) and its six findings
      # are recorded in `.gitleaksignore`.
      - name: Gitleaks scan (merge gate)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
