name: Security — 依赖安全扫描

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 UTC 08:00 自动扫描
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  dependency-scan:
    name: pip-audit 依赖漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt

      # This workflow runs on pull requests and is a merge check. Fail on findings.
      - name: Run pip-audit (merge gate)
        run: pip-audit --strict --desc --requirement requirements.txt

  secret-scan:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pin to a maintained major release instead of a floating branch.
      - name: TruffleHog secret scan (merge gate)
        uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: --only-verified
