# Ruff 代码风格配置
# https://docs.astral.sh/ruff/

target-version = "py310"
line-length = 120

[lint]
# 基础规则集
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade
]

ignore = [
    "E501",   # 行长度（由 formatter 处理）
    "S101",   # assert 使用（测试中需要）
    "S603",   # subprocess 调用
    "S607",   # 部分路径执行
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"**/__init__.py" = ["F401"]

[format]
quote-style = "double"
