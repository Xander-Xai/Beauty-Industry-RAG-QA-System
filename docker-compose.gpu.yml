# GPU 服务覆盖层 — 双卡生产模式
# 用法: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# AWQ INT4 量化部署（替代 NF4，非默认路径）:
#   1. 自行准备/执行量化流程，产出 AWQ 权重（本仓库不随附量化脚本或权重）
#   2. 修改下方 vllm-gen-14b 的 command: --model /models/qwen3-14b-awq --quantization awq
services:
  app:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-gen-14b:
    image: vllm/vllm-openai:latest
    ports:
      - "8100:8000"
    volumes:
      - ${MODEL_DIR:-./models}:/models
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: >
      --model /models/qwen3-14b
      --max-model-len 8192
      --gpu-memory-utilization 0.85
      --port 8000
      --enable-lora
      --lora-modules QLoRA-adapter=/models/Qwen3-14B-QLoRA-adapter
      --enable-prefix-caching
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  vllm-4b:
    image: vllm/vllm-openai:latest
    ports:
      - "8101:8000"
    volumes:
      - ${MODEL_DIR:-./models}:/models
    environment:
      - CUDA_VISIBLE_DEVICES=1
    command: >
      --model /models/qwen3-4b
      --max-model-len 4096
      --gpu-memory-utilization 0.4
      --port 8000
      --enable-prefix-caching
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
